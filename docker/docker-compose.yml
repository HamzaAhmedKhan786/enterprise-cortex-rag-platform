services:
  streamlit:
    build:
      context: ..
      dockerfile: docker/Dockerfile.streamlit
    image: enterprise-cortex-workspace:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8502:8501"
    env_file:
      - path: ../.env
        required: false
    environment:
      CORTEX_DB: /app/data/private/cortex.sqlite3
      OLLAMA_HOST: http://host.docker.internal:11434
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - workspace_data:/app/data/private
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: ["no-new-privileges:true"]

  metrics:
    image: enterprise-cortex-workspace:local
    profiles: [observability]
    command: ["python", "-m", "cortex.metrics_server"]
    environment:
      CORTEX_DB: /app/data/private/cortex.sqlite3
      METRICS_HOST: 0.0.0.0
    volumes:
      - workspace_data:/app/data/private
    depends_on:
      streamlit:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    ports: ["127.0.0.1:9095:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [metrics]

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    entrypoint: ["/bin/sh", "-ec", "test -n \"$$GF_SECURITY_ADMIN_PASSWORD\" || { echo 'Set GRAFANA_ADMIN_PASSWORD before enabling monitoring'; exit 1; }; exec /run.sh"]
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

  postgres:
    image: postgres:16
    profiles: [legacy]
    environment:
      POSTGRES_DB: enterprise_cortex_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/postgres_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

volumes:
  workspace_data:
  grafana_data:
  postgres_data:
